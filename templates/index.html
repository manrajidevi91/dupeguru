<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>dupeGuru - Ultimate Redesign</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "bg-main": "#050505",
                        "surface-glass": "rgba(20, 20, 25, 0.7)",
                        "surface-card": "#121216",
                        "accent-blue": "#3b82f6",
                        "accent-purple": "#8b5cf6",
                        "primary": {
                            DEFAULT: "#3b82f6",
                            dark: "#2563eb",
                            light: "#60a5fa"
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    },
                    animation: {
                        'shimmer': 'shimmer 2s infinite linear',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                },
            },
        }
    </script>
    <style>
        :root {
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(15, 15, 20, 0.8);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.05) 0px, transparent 50%);
            height: 100vh;
            overflow: hidden;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
        }

        .glass-card {
            background: rgba(30, 30, 40, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(59, 130, 246, 0.3);
            background: rgba(30, 30, 40, 0.6);
            transform: translateY(-2px);
        }

        .premium-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        }

        .shimmer-btn {
            background: linear-gradient(90deg, 
                rgba(59, 130, 246, 0) 0%, 
                rgba(255, 255, 255, 0.2) 50%, 
                rgba(59, 130, 246, 0) 100%);
            background-size: 200% 100%;
            animation: shimmer 3s infinite;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon { font-variation-settings: 'FILL' 1; }

        .group-container {
            border-left: 2px solid transparent;
            transition: border-color 0.3s;
        }
        .group-container:hover {
            border-left-color: #3b82f6;
        }

        /* Input field glow */
        input:focus {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.1);
        }

        /* Explorer Modal Styles */
        .modal-backdrop {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
        }
        .explorer-item:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="text-slate-200">

    <!-- App Shell -->
    <div class="flex h-full w-full overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-80 h-full glass border-r border-white/5 flex flex-col z-30 transition-all duration-500">
            <!-- Header/Logo Area -->
            <div class="p-8 flex items-center gap-4">
                <div class="w-10 h-10 premium-gradient rounded-xl shadow-lg shadow-blue-500/20 flex items-center justify-center rotate-3">
                    <span class="material-symbols-rounded text-white text-2xl fill-icon">layers</span>
                </div>
                <div>
                    <h1 class="font-display font-bold text-xl tracking-tight text-white">dupeGuru</h1>
                    <p class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Web Evolution</p>
                </div>
            </div>

            <!-- Scrollable Content -->
            <div class="flex-1 overflow-y-auto custom-scrollbar px-6 space-y-8 pb-10">
                
                <!-- Modes -->
                <section>
                    <label class="text-[10px] uppercase tracking-widest font-bold text-slate-500 mb-4 block px-2">Scanning Engine</label>
                    <div class="space-y-1">
                        <button class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 text-slate-400 transition-all group">
                            <span class="material-symbols-rounded text-xl group-hover:text-blue-400">text_fields</span>
                            <span class="text-sm font-medium">Standard</span>
                        </button>
                        <button class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 text-slate-400 transition-all group">
                            <span class="material-symbols-rounded text-xl group-hover:text-indigo-400">music_note</span>
                            <span class="text-sm font-medium">Music</span>
                        </button>
                        <button class="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-500/10 text-blue-400 border border-blue-500/20 shadow-lg shadow-blue-500/5">
                            <span class="material-symbols-rounded text-xl fill-icon">image</span>
                            <span class="text-sm font-bold">Picture Mode</span>
                        </button>
                    </div>
                </section>

                <!-- Folder Management -->
                <section>
                    <div class="flex justify-between items-center mb-4 px-2">
                        <label class="text-[10px] uppercase tracking-widest font-bold text-slate-500">Source Directories</label>
                        <span id="folderCountLabel" class="text-[10px] text-blue-500 font-bold bg-blue-500/10 px-2 py-0.5 rounded-full">0</span>
                    </div>
                    
                    <div class="relative group">
                        <input type="text" id="folderPathInput" placeholder="Enter path (e.g. C:\Images)" 
                            class="w-full bg-slate-900/50 border border-white/5 rounded-2xl py-3.5 pl-4 pr-16 text-sm focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all placeholder:text-slate-600"/>
                        <div class="absolute right-2 top-2 flex items-center">
                            <button id="browseBtn" title="Browse Folder" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition-all border border-white/5">
                                <span class="material-symbols-rounded text-xl">folder_open</span>
                            </button>
                        </div>
                    </div>

                    <button id="addFolderBtn" class="w-full mt-4 flex items-center justify-center gap-2 py-3 rounded-2xl bg-blue-500/10 text-blue-400 border border-blue-500/20 hover:bg-blue-500/20 transition-all font-bold text-sm">
                        <span class="material-symbols-rounded text-xl">add_circle</span>
                        ADD DIRECTORY
                    </button>

                    <div id="foldersList" class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar pr-1">
                        <!-- Folders injected here -->
                    </div>
                </section>

                <!-- Scan Parameters -->
                <section>
                    <label class="text-[10px] uppercase tracking-widest font-bold text-slate-500 mb-4 block px-2">Parameters</label>
                    <div class="glass-card rounded-2xl p-4 space-y-5">
                        <div class="space-y-1">
                            <div class="flex justify-between items-center bg-slate-900/50 p-3 rounded-xl border border-white/5 group cursor-pointer hover:border-blue-500/30 transition-all">
                                <div class="flex flex-col">
                                    <span class="text-[10px] text-slate-500 font-bold uppercase">Algorithm</span>
                                    <span class="text-xs font-semibold">FUZZY BLOCK</span>
                                </div>
                                <span class="material-symbols-rounded text-slate-600">settings_suggest</span>
                            </div>
                        </div>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="text-[10px] text-slate-500 font-bold uppercase">Similarity Threshold</span>
                                <span id="thresholdVal" class="text-xs font-bold text-blue-400">95%</span>
                            </div>
                            <input id="thresholdSlider" type="range" min="0" max="100" value="95" 
                                class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500"/>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Action Area -->
            <div class="p-6 border-t border-white/5">
                <button id="startScanBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-3 shadow-xl shadow-blue-600/20 active:scale-95 transition-all group overflow-hidden relative">
                    <span class="material-symbols-rounded text-2xl group-hover:rotate-12 transition-transform">rocket_launch</span>
                    <span class="tracking-wide">START SCANNING</span>
                    <div class="shimmer-btn absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
                </button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="flex-1 h-full flex flex-col bg-bg-main relative overflow-hidden">
            
            <!-- Dynamic Background elements -->
            <div class="absolute top-[-10%] right-[-5%] w-[40%] h-[40%] bg-blue-600/5 blur-[120px] rounded-full"></div>
            <div class="absolute bottom-[-10%] left-[-5%] w-[30%] h-[30%] bg-purple-600/5 blur-[100px] rounded-full"></div>

            <!-- Toolbar / Header -->
            <header class="h-24 flex items-center justify-between px-10 relative z-20">
                <div>
                    <h2 class="text-2xl font-display font-bold text-white flex items-center gap-3">
                        Duplicate Gallery 
                        <span id="groupCount" class="text-sm font-sans font-normal text-slate-500 bg-slate-800/50 px-3 py-1 rounded-full border border-white/5">0 Groups</span>
                    </h2>
                </div>
                <div class="flex items-center gap-3">
                    <div class="flex bg-slate-900/80 backdrop-blur-md border border-white/5 p-1 rounded-2xl">
                        <button id="markSelectedBtn" class="flex items-center gap-2 px-4 py-2 hover:bg-white/5 text-slate-300 rounded-xl text-xs font-semibold transition-all">
                            <span class="material-symbols-rounded text-lg">done_all</span>
                            Select All
                        </button>
                        <div class="w-px h-4 bg-white/5 self-center mx-1"></div>
                        <button id="deleteSelectedBtn" class="flex items-center gap-2 px-5 py-2.5 bg-red-500 text-white hover:bg-red-600 rounded-xl text-xs font-bold shadow-lg shadow-red-500/20 transition-all active:scale-95">
                            <span class="material-symbols-rounded text-lg">delete</span>
                            Trash Selected
                        </button>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="flex-1 overflow-y-auto custom-scrollbar px-10 pb-20 relative z-10">
                <div id="resultsGrid" class="space-y-12 max-w-7xl mx-auto">
                    <!-- Empty State -->
                    <div id="emptyState" class="flex flex-col items-center justify-center py-40 text-slate-600 animate-float">
                        <div class="w-32 h-32 bg-slate-900/50 rounded-full flex items-center justify-center mb-8 border border-white/5">
                            <span class="material-symbols-rounded text-6xl text-slate-700">folder_open</span>
                        </div>
                        <h3 class="text-xl font-display font-bold text-slate-400 mb-2">Workspace Empty</h3>
                        <p class="text-sm text-slate-500 max-w-xs text-center balance">Add folders on the left panel and ignite the scanner to reveal duplicate clusters.</p>
                    </div>
                </div>
            </div>

            <!-- Status Footer -->
            <footer class="h-10 glass border-t border-white/5 flex items-center justify-between px-10 text-[10px] font-bold text-slate-500 uppercase tracking-widest relative z-30">
                <div class="flex items-center gap-6">
                    <div class="flex items-center gap-2">
                        <div id="statusDot" class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div>
                        <span id="statusText">System Ready</span>
                    </div>
                    <span id="processedText" class="text-blue-500/70"></span>
                </div>
                <div class="flex items-center gap-8">
                    <div class="flex items-center gap-2">
                        <span class="text-slate-600">Active Scan:</span>
                        <span id="duplicateCountText" class="text-slate-300">0 Items Found</span>
                    </div>
                    <span>v4.0.0 Web</span>
                </div>
            </footer>
        </main>
    </div>

    <!-- Scripts -->

    <script>
        const state = {
            folders: [],
            results: [],
            scanning: false
        };

        const elements = {
            folderPathInput: document.getElementById('folderPathInput'),
            addFolderBtn: document.getElementById('addFolderBtn'),
            browseBtn: document.getElementById('browseBtn'),
            foldersList: document.getElementById('foldersList'),
            startScanBtn: document.getElementById('startScanBtn'),
            resultsGrid: document.getElementById('resultsGrid'),
            groupCount: document.getElementById('groupCount'),
            statusText: document.getElementById('statusText'),
            statusDot: document.getElementById('statusDot'),
            processedText: document.getElementById('processedText'),
            duplicateCountText: document.getElementById('duplicateCountText'),
            thresholdSlider: document.getElementById('thresholdSlider'),
            thresholdVal: document.getElementById('thresholdVal'),
            folderCountLabel: document.getElementById('folderCountLabel'),
            deleteSelectedBtn: document.getElementById('deleteSelectedBtn'),
            markSelectedBtn: document.getElementById('markSelectedBtn')
        };

        async function browseNative() {
            try {
                const res = await fetch('/api/browse_os');
                const data = await res.json();
                if (data.status === 'success') {
                    elements.folderPathInput.value = data.path;
                    addFolder();
                }
            } catch (e) {
                showNotification('Failed to open folder picker', 'error');
            }
        }

        // Threshold slider dynamic update
        elements.thresholdSlider.addEventListener('input', (e) => {
            elements.thresholdVal.textContent = e.target.value + '%';
        });

        async function fetchFolders() {
            try {
                const res = await fetch('/api/folders');
                const data = await res.json();
                state.folders = data.folders || [];
                renderFolders();
            } catch (e) { console.error('Failed to fetch folders', e); }
        }

        async function addFolder() {
            const path = elements.folderPathInput.value.trim();
            if (!path) return;
            
            try {
                const res = await fetch('/api/folders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    state.folders = data.folders;
                    elements.folderPathInput.value = '';
                    renderFolders();
                    showNotification('Folder added successfully');
                } else {
                    alert(data.message);
                }
            } catch (e) { alert('Failed to connect to backend'); }
        }

        async function removeFolder(path) {
            try {
                const res = await fetch('/api/folders', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path })
                });
                const data = await res.json();
                state.folders = data.folders;
                renderFolders();
            } catch (e) { console.error(e); }
        }

        function renderFolders() {
            elements.folderCountLabel.textContent = state.folders.length;
            if (state.folders.length === 0) {
                elements.foldersList.innerHTML = `<div class="text-[10px] text-slate-600 text-center py-4 italic">No folders assigned</div>`;
                return;
            }

            elements.foldersList.innerHTML = state.folders.map(path => {
                const basename = path.split(/[\\/]/).pop() || path;
                return `
                    <div class="group flex items-center justify-between p-3 bg-slate-900/30 rounded-xl border border-white/5 hover:border-blue-500/30 transition-all">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <span class="material-symbols-rounded text-slate-500 text-lg group-hover:text-blue-400 transition-colors">folder</span>
                            <div class="flex flex-col overflow-hidden">
                                <span class="text-xs font-bold text-slate-200 truncate">${basename}</span>
                                <span class="text-[9px] text-slate-600 truncate uppercase tracking-tighter">${path}</span>
                            </div>
                        </div>
                        <button onclick="removeFolder('${path.replace(/\\/g, '\\\\')}')" class="opacity-0 group-hover:opacity-100 p-1.5 hover:bg-red-500/10 hover:text-red-500 text-slate-600 rounded-lg transition-all">
                            <span class="material-symbols-rounded text-sm">close</span>
                        </button>
                    </div>
                `}).join('');
        }

        async function startScan() {
            if (state.scanning) return;
            if (state.folders.length === 0) {
                showNotification('Select at least one folder first', 'error');
                return;
            }
            
            state.scanning = true;
            updateUIForScanning(true);
            
            try {
                const res = await fetch('/api/scan', { method: 'POST' });
                const data = await res.json();
                
                if (data.status === 'success') {
                    state.results = data.groups;
                    renderResults();
                } else {
                    alert(data.message);
                }
            } catch (e) {
                console.error(e);
                alert('Scan communication failure');
            } finally {
                state.scanning = false;
                updateUIForScanning(false);
            }
        }

        function updateUIForScanning(isScanning) {
            elements.startScanBtn.disabled = isScanning;
            if (isScanning) {
                elements.startScanBtn.innerHTML = `<span class="material-symbols-rounded animate-spin">progress_activity</span> <span class="tracking-widest">ANALYZING...</span>`;
                elements.statusText.textContent = 'Scanning Environment...';
                elements.statusDot.classList.replace('bg-emerald-500', 'bg-blue-500');
                elements.statusDot.classList.add('animate-pulse');
            } else {
                elements.startScanBtn.innerHTML = `<span class="material-symbols-rounded text-2xl">rocket_launch</span> <span class="tracking-wide">START SCANNING</span>`;
                elements.statusText.textContent = 'Analysis Complete';
                elements.statusDot.classList.replace('bg-blue-500', 'bg-emerald-500');
                elements.statusDot.classList.remove('animate-pulse');
            }
        }

        async function deleteSelected() {
            const checkboxes = elements.resultsGrid.querySelectorAll('input[type="checkbox"]:checked');
            const paths = Array.from(checkboxes).map(cb => cb.dataset.path);
            
            if (paths.length === 0) {
                showNotification('Nothing selected for deletion', 'warning');
                return;
            }
            
            if (!confirm(`Relocate ${paths.length} items to system recycle bin?`)) return;
            
            try {
                const res = await fetch('/api/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paths })
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    showNotification(`Recycle bin successfully populated with ${data.deleted} items`);
                    startScan(); // Refresh
                } else {
                    alert('Error during deletion operation');
                }
            } catch (e) { alert('Delete failed'); }
        }

        function renderResults() {
            elements.groupCount.textContent = `${state.results.length} clusters identified`;
            elements.duplicateCountText.textContent = `${state.results.reduce((acc, g) => acc + g.duplicates.length, 0)} Duplicates Found`;
            
            if (state.results.length === 0) {
                elements.resultsGrid.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-40 text-slate-600 animate-float">
                        <div class="w-32 h-32 bg-slate-900/50 rounded-full flex items-center justify-center mb-8 border border-white/5">
                            <span class="material-symbols-rounded text-6xl text-slate-700">task_alt</span>
                        </div>
                        <h3 class="text-xl font-display font-bold text-slate-100 mb-2">No Duplicates Detected</h3>
                        <p class="text-sm text-slate-500">Your workspace is clean. No redundant clusters found at ${elements.thresholdSlider.value}% threshold.</p>
                    </div>
                `;
                return;
            }

            elements.resultsGrid.innerHTML = state.results.map(group => {
                const sizeMB = (group.ref.size / 1024 / 1024).toFixed(2);
                return `
                <section class="group-container animate-in fade-in slide-in-from-bottom-5 duration-500">
                    <!-- Cluster Header -->
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-8 h-8 rounded-lg bg-blue-500/10 border border-blue-500/20 flex items-center justify-center">
                            <span class="material-symbols-rounded text-blue-500 text-sm font-bold">${group.id}</span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-100 flex items-center gap-4">
                            ${group.ref.name}
                            <span class="text-[10px] font-bold text-slate-500 bg-slate-800/50 px-2.5 py-1 rounded-full border border-white/5">CLUSTER MASTER</span>
                        </h3>
                        <div class="h-px bg-white/5 flex-1"></div>
                    </div>

                    <div class="grid grid-cols-1 gap-3">
                        <!-- Cluster Master (Reference) -->
                        <div class="glass-card p-4 rounded-2xl flex items-center gap-6 border-white/5">
                            <div class="w-20 h-20 rounded-xl overflow-hidden bg-slate-900 flex-shrink-0 shadow-2xl relative group/img">
                                <img src="/api/image?path=${encodeURIComponent(group.ref.path)}" class="w-full h-full object-cover transition-transform group-hover/img:scale-110">
                                <div class="absolute inset-0 bg-blue-500/20 opacity-0 group-hover/img:opacity-100 transition-opacity flex items-center justify-center">
                                    <span class="material-symbols-rounded text-white">open_in_new</span>
                                </div>
                            </div>
                            <div class="flex-1 space-y-1">
                                <div class="flex items-center gap-3">
                                    <span class="text-sm font-bold text-white">${group.ref.name}</span>
                                    <span class="px-2 py-0.5 bg-blue-500 text-white text-[9px] font-black uppercase rounded shadow-lg shadow-blue-500/30 tracking-tight">Master</span>
                                </div>
                                <div class="flex items-center gap-3 text-xs text-slate-500">
                                    <span class="flex items-center gap-1"><span class="material-symbols-rounded text-xs">folder</span> ${group.ref.folder}</span>
                                    <span class="w-1 h-1 rounded-full bg-slate-700"></span>
                                    <span class="flex items-center gap-1"><span class="material-symbols-rounded text-xs">straighten</span> ${sizeMB} MB</span>
                                    ${group.ref.dimensions ? `<span class="w-1 h-1 rounded-full bg-slate-700"></span> <span class="flex items-center gap-1"><span class="material-symbols-rounded text-xs">photo_size_select_actual</span> ${group.ref.dimensions}</span>` : ''}
                                </div>
                            </div>
                            <div class="px-4 opacity-20 cursor-not-allowed">
                                <div class="w-6 h-6 rounded-lg border-2 border-slate-700 flex items-center justify-center">
                                    <span class="material-symbols-rounded text-base">lock</span>
                                </div>
                            </div>
                        </div>

                        <!-- Cluster Candidates (Duplicates) -->
                        <div class="space-y-2 mt-2">
                            ${group.duplicates.map(dupe => {
                                const dupeSizeMB = (dupe.size / 1024 / 1024).toFixed(2);
                                return `
                                <div class="bg-slate-900/40 p-3 rounded-2xl flex items-center gap-5 border border-white/5 hover:border-blue-500/20 hover:bg-slate-900/60 transition-all">
                                    <div class="w-14 h-14 rounded-xl overflow-hidden bg-slate-800 flex-shrink-0 opacity-70 hover:opacity-100 transition-opacity">
                                        <img src="/api/image?path=${encodeURIComponent(dupe.path)}" class="w-full h-full object-cover">
                                    </div>
                                    <div class="flex-1">
                                        <span class="text-xs font-semibold text-slate-300">${dupe.name}</span>
                                        <div class="flex items-center gap-3 text-[10px] text-slate-500 mt-1">
                                            <span class="text-blue-400 font-bold">${dupe.percentage}% Match</span>
                                            <span class="w-1 h-1 rounded-full bg-slate-700"></span>
                                            <span class="truncate max-w-[200px]">${dupe.folder}</span>
                                            <span class="w-1 h-1 rounded-full bg-slate-700"></span>
                                            <span>${dupeSizeMB} MB</span>
                                        </div>
                                    </div>
                                    <div class="px-4">
                                        <label class="relative flex items-center cursor-pointer">
                                            <input type="checkbox" data-path="${dupe.path}" checked 
                                                class="peer appearance-none w-6 h-6 border-2 border-slate-700 rounded-lg checked:bg-blue-500 checked:border-blue-500 transition-all cursor-pointer">
                                            <span class="material-symbols-rounded absolute inset-0 text-white scale-0 peer-checked:scale-100 transition-transform flex items-center justify-center font-bold text-lg pointer-events-none">check</span>
                                        </label>
                                    </div>
                                </div>
                            `}).join('')}
                        </div>
                    </div>
                </section>
                `}).join('');
        }

        // Action Handlers
        elements.browseBtn.addEventListener('click', browseNative);
        elements.addFolderBtn.addEventListener('click', addFolder);
        elements.folderPathInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addFolder(); });
        elements.startScanBtn.addEventListener('click', startScan);
        elements.deleteSelectedBtn.addEventListener('click', deleteSelected);
        elements.markSelectedBtn.addEventListener('click', () => {
            const checkboxes = elements.resultsGrid.querySelectorAll('input[type="checkbox"]');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
            elements.markSelectedBtn.innerHTML = allChecked ? 
                `<span class="material-symbols-rounded text-lg">select_all</span> Select All` : 
                `<span class="material-symbols-rounded text-lg">deselect</span> Deselect All`;
        });

        // Notifications
        function showNotification(msg, type = 'success') {
            const colors = { success: 'bg-emerald-500', error: 'bg-red-500', warning: 'bg-amber-500' };
            const notify = document.createElement('div');
            notify.className = `fixed bottom-12 right-12 ${colors[type]} text-white px-6 py-3 rounded-2xl font-bold text-sm shadow-2xl z-50 animate-in slide-in-from-bottom-10 fade-in duration-300`;
            notify.textContent = msg;
            document.body.appendChild(notify);
            setTimeout(() => {
                notify.classList.add('animate-out', 'fade-out', 'slide-out-to-bottom-10');
                setTimeout(() => notify.remove(), 400);
            }, 3000);
        }

        // Initial Load
        fetchFolders();
    </script>
</body>
</html>
