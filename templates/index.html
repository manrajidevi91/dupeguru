<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>dupeGuru - Redesign (Picture Mode)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#311300",
                        "primary-container": "#0078d4",
                        "error-container": "#93000a",
                        "on-secondary-fixed-variant": "#2d486b",
                        "background": "#131313",
                        "on-primary-fixed": "#001c39",
                        "on-tertiary-container": "#ffffff",
                        "secondary-container": "#2d486b",
                        "outline": "#8a919e",
                        "on-surface": "#e5e2e1",
                        "inverse-on-surface": "#303030",
                        "on-primary-fixed-variant": "#004883",
                        "on-surface-variant": "#c0c7d4",
                        "on-primary-container": "#ffffff",
                        "primary-fixed-dim": "#a3c9ff",
                        "surface": "#131313",
                        "surface-container-low": "#1b1b1c",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed-dim": "#adc8f2",
                        "inverse-surface": "#e5e2e1",
                        "surface-container": "#202020",
                        "tertiary-fixed-dim": "#ffb689",
                        "on-background": "#e5e2e1",
                        "tertiary-fixed": "#ffdbc8",
                        "surface-tint": "#a3c9ff",
                        "on-secondary-container": "#9cb7df",
                        "surface-dim": "#131313",
                        "surface-variant": "#353535",
                        "surface-bright": "#393939",
                        "on-error": "#690005",
                        "inverse-primary": "#0060ab",
                        "on-tertiary-fixed-variant": "#743500",
                        "outline-variant": "#404752",
                        "on-primary": "#00315c",
                        "on-secondary-fixed": "#001c39",
                        "surface-container-highest": "#353535",
                        "primary": "#a3c9ff",
                        "on-secondary": "#143153",
                        "on-tertiary": "#512300",
                        "surface-container-high": "#2a2a2a",
                        "primary-fixed": "#d3e3ff",
                        "error": "#ffb4ab",
                        "secondary": "#adc8f2",
                        "surface-container-lowest": "#0e0e0e",
                        "tertiary": "#ffb689",
                        "tertiary-container": "#bc5b00",
                        "secondary-fixed": "#d3e3ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .mica {
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(20px);
        }
        .primary-gradient {
            background: linear-gradient(135deg, #a3c9ff 0%, #0078d4 100%);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #404752;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-background text-on-surface overflow-hidden">
<!-- Top Bar (Windows 11 Anchor) -->
<header class="fixed top-0 w-full h-12 bg-zinc-900/70 backdrop-blur-[20px] flex justify-between items-center px-4 z-50">
<div class="flex items-center gap-3">
<div class="w-4 h-4 bg-primary rounded-sm shadow-[0_0_8px_rgba(163,201,255,0.4)]"></div>
<span class="text-sm font-semibold text-zinc-100 tracking-tight">dupeGuru - Redesign (Picture Mode)</span>
</div>
<div class="flex items-center gap-1">
<button class="w-10 h-12 flex items-center justify-center hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-[18px]">remove</span>
</button>
<button class="w-10 h-12 flex items-center justify-center hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-[16px]">check_box_outline_blank</span>
</button>
<button class="w-10 h-12 flex items-center justify-center hover:bg-red-500/80 transition-colors">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
</header>
<!-- Side Navigation Bar -->
<aside class="fixed left-0 top-12 h-[calc(100vh-48px)] w-64 mica border-r border-white/5 flex flex-col z-40">
<div class="p-4 space-y-8 overflow-y-auto custom-scrollbar flex-1">
<!-- Application Mode -->
<div>
<label class="text-[0.6875rem] font-bold uppercase tracking-wider text-zinc-500 mb-3 block">Application Mode</label>
<nav class="space-y-1">
<button class="w-full flex items-center gap-3 px-3 py-2 text-zinc-400 hover:bg-white/10 hover:text-zinc-100 rounded-lg transition-colors">
<span class="material-symbols-outlined text-sm">music_note</span>
<span class="text-sm">Standard</span>
</button>
<button class="w-full flex items-center gap-3 px-3 py-2 text-zinc-400 hover:bg-white/10 hover:text-zinc-100 rounded-lg transition-colors">
<span class="material-symbols-outlined text-sm">audiotrack</span>
<span class="text-sm">Music</span>
</button>
<button class="w-full flex items-center gap-3 px-4 py-2 text-[#A3C9FF] border-l-4 border-[#A3C9FF] bg-white/5 rounded-r-lg">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">image</span>
<span class="text-sm font-semibold">Picture</span>
</button>
</nav>
</div>
<!-- Folders to Scan -->
<div>
<div class="flex justify-between items-center mb-3">
<label class="text-[0.6875rem] font-bold uppercase tracking-wider text-zinc-500 block">Folders to Scan</label>
</div>
<div class="flex gap-2 mb-3">
    <input type="text" id="folderPathInput" placeholder="Enter folder path..." class="flex-1 bg-surface-container-low text-sm border-none rounded-lg focus:ring-1 focus:ring-primary px-3 py-2 text-zinc-100 placeholder:text-zinc-600">
    <button id="addFolderBtn" class="text-primary hover:bg-primary/10 p-2 rounded-lg transition-colors">
        <span class="material-symbols-outlined text-[20px]">add</span>
    </button>
</div>
<div id="foldersList" class="space-y-2">
    <!-- Folders will be injected here -->
</div>
</div>
<!-- Scan Options -->
<div>
<label class="text-[0.6875rem] font-bold uppercase tracking-wider text-zinc-500 mb-3 block">Scan Options</label>
<div class="space-y-4">
<div class="space-y-1">
<span class="text-[0.75rem] text-zinc-400">Scan Type</span>
<div class="w-full bg-surface-container-low p-2 rounded-lg text-sm flex justify-between items-center cursor-pointer hover:bg-surface-container-high transition-colors border border-outline-variant/10">
<span>Contents</span>
<span class="material-symbols-outlined text-sm">expand_more</span>
</div>
</div>
<div class="space-y-1">
<div class="flex justify-between items-center">
<span class="text-[0.75rem] text-zinc-400">Threshold</span>
<span class="text-[0.75rem] text-primary">95%</span>
</div>
<input id="thresholdSlider" class="w-full accent-primary h-1 bg-surface-container-highest rounded-full appearance-none cursor-pointer" type="range" value="95" min="0" max="100"/>
</div>
</div>
</div>
</div>
<div class="p-4 border-t border-white/5 space-y-3">
<button id="startScanBtn" class="w-full primary-gradient text-on-primary font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary-container/20 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined">play_arrow</span>
                START SCAN
            </button>
</div>
</aside>
<!-- Main Content Area -->
<main class="ml-64 mt-12 h-[calc(100vh-72px)] flex flex-col bg-surface-container-lowest/30 overflow-hidden">
<!-- Results Header & Toolbar -->
<header class="p-6 pb-2 space-y-6">
<div class="flex justify-between items-end">
<div>
<span class="text-[0.6875rem] font-bold text-primary uppercase tracking-[0.2em] mb-1 block">Picture Mode</span>
<h1 class="text-2xl font-semibold tracking-tight">Duplicate Results <span id="groupCount" class="text-zinc-500 font-normal ml-2">(0 Groups Found)</span></h1>
</div>
<div class="flex gap-2">
<button id="deleteSelectedBtn" class="flex items-center gap-2 px-4 py-2 bg-error/10 text-error hover:bg-error/20 rounded-lg text-sm font-semibold transition-colors">
<span class="material-symbols-outlined text-sm">delete</span>
                        Delete Selected
                    </button>
<button class="flex items-center gap-2 px-4 py-2 bg-white/5 text-zinc-100 hover:bg-white/10 rounded-lg text-sm font-semibold border border-white/5 transition-colors">
<span class="material-symbols-outlined text-sm">drive_file_move</span>
                        Move Selected
                    </button>
<button class="flex items-center gap-2 px-4 py-2 bg-white/5 text-zinc-100 hover:bg-white/10 rounded-lg text-sm font-semibold border border-white/5 transition-colors">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">bookmark</span>
                        Mark References
                    </button>
</div>
</div>
</header>
<!-- Results Grid -->
<div class="flex-1 overflow-y-auto custom-scrollbar px-6 py-4">
<div id="resultsGrid" class="space-y-10 max-w-6xl">
    <!-- Search results will be injected here -->
    <div class="flex flex-col items-center justify-center h-64 text-zinc-600">
        <span class="material-symbols-outlined text-6xl mb-4">image_search</span>
        <p class="text-lg">Add folders and click "START SCAN" to find duplicates</p>
    </div>
</div>
</div>
<!-- Status Bar -->
<footer class="h-6 bg-[#0E0E0E] border-t border-white/5 flex justify-between items-center px-4 fixed bottom-0 w-full z-50">
<div class="flex items-center gap-4">
<span id="statusText" class="text-[0.6875rem] font-bold uppercase tracking-wider text-zinc-500">Ready</span>
<span id="processedText" class="text-[0.6875rem] text-zinc-500"></span>
</div>
<div class="flex items-center gap-4">
<span id="duplicateCountText" class="text-[0.6875rem] text-zinc-400"></span>
<div class="flex items-center gap-2 text-zinc-500">
<span class="text-[0.6875rem]">Documentation</span>
<span class="w-[1px] h-2 bg-zinc-800"></span>
<span class="text-[0.6875rem]">Privacy Policy</span>
</div>
</div>
</footer>
</main>
<script>
    const state = {
        folders: [],
        results: [],
        scanning: false
    };

    const elements = {
        folderPathInput: document.getElementById('folderPathInput'),
        addFolderBtn: document.getElementById('addFolderBtn'),
        foldersList: document.getElementById('foldersList'),
        startScanBtn: document.getElementById('startScanBtn'),
        resultsGrid: document.getElementById('resultsGrid'),
        groupCount: document.getElementById('groupCount'),
        statusText: document.getElementById('statusText'),
        processedText: document.getElementById('processedText'),
        duplicateCountText: document.getElementById('duplicateCountText'),
        thresholdSlider: document.getElementById('thresholdSlider')
    };

    async function fetchFolders() {
        const res = await fetch('/api/folders');
        const data = await res.json();
        state.folders = data.folders;
        renderFolders();
    }

    async function addFolder() {
        const path = elements.folderPathInput.value.trim();
        if (!path) return;
        
        const res = await fetch('/api/folders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path })
        });
        const data = await res.json();
        if (data.status === 'success') {
            state.folders = data.folders;
            elements.folderPathInput.value = '';
            renderFolders();
        } else {
            alert(data.message);
        }
    }

    async function removeFolder(path) {
        const res = await fetch('/api/folders', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path })
        });
        const data = await res.json();
        state.folders = data.folders;
        renderFolders();
    }

    function renderFolders() {
        elements.foldersList.innerHTML = state.folders.map(path => `
            <div class="group flex items-center justify-between p-2 bg-surface-container-low rounded-lg border border-transparent hover:border-outline-variant/20 transition-all">
                <div class="flex items-center gap-2 overflow-hidden">
                    <span class="material-symbols-outlined text-zinc-500 text-sm">folder</span>
                    <span class="text-[0.8125rem] text-zinc-300 truncate" title="${path}">${path}</span>
                </div>
                <button onclick="removeFolder('${path.replace(/\\/g, '\\\\')}')" class="opacity-0 group-hover:opacity-100 hover:text-error transition-all">
                    <span class="material-symbols-outlined text-sm">delete</span>
                </button>
            </div>
        `).join('');
    }

    async function startScan() {
        if (state.scanning) return;
        
        state.scanning = true;
        updateUIForScanning(true);
        
        try {
            const res = await fetch('/api/scan', { method: 'POST' });
            const data = await res.json();
            
            if (data.status === 'success') {
                state.results = data.groups;
                renderResults();
            } else {
                alert(data.message);
            }
        } catch (e) {
            console.error(e);
            alert('Scan failed. See console for details.');
        } finally {
            state.scanning = false;
            updateUIForScanning(false);
        }
    }

    function updateUIForScanning(isScanning) {
        elements.startScanBtn.disabled = isScanning;
        elements.startScanBtn.innerHTML = isScanning ? 
            `<span class="material-symbols-outlined animate-spin">sync</span> SCANNING...` : 
            `<span class="material-symbols-outlined">play_arrow</span> START SCAN`;
        
        elements.statusText.textContent = isScanning ? 'Scanning...' : 'Scanning Complete';
        elements.statusText.className = isScanning ? 'text-primary' : 'text-primary';
    }

    async function deleteSelected() {
        const checkboxes = elements.resultsGrid.querySelectorAll('input[type="checkbox"]:checked');
        const paths = Array.from(checkboxes).map(cb => cb.dataset.path);
        
        if (paths.length === 0) return;
        if (!confirm(`Are you sure you want to send ${paths.length} files to Trash?`)) return;
        
        const res = await fetch('/api/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paths })
        });
        const data = await res.json();
        
        if (data.status === 'success') {
            alert(`Successfully deleted ${data.deleted} files.`);
            startScan(); // Refresh results
        } else {
            alert('Error deleting files.');
        }
    }

    function renderResults() {
        elements.groupCount.textContent = `(${state.results.length} Groups Found)`;
        elements.duplicateCountText.textContent = `Found ${state.results.reduce((acc, g) => acc + g.duplicates.length, 0)} duplicates`;
        
        if (state.results.length === 0) {
            elements.resultsGrid.innerHTML = `
                <div class="flex flex-col items-center justify-center h-64 text-zinc-600">
                    <span class="material-symbols-outlined text-6xl mb-4">sentiment_satisfied</span>
                    <p class="text-lg">No duplicates found in selected folders</p>
                </div>
            `;
            return;
        }

        elements.resultsGrid.innerHTML = state.results.map(group => `
            <section class="space-y-4">
                <div class="flex items-center gap-3 pb-2 border-b border-white/5">
                    <span class="material-symbols-outlined text-primary text-xl">folder_zip</span>
                    <h3 class="font-semibold text-zinc-100">Group ${group.id}: "${group.ref.name}"</h3>
                </div>
                <div class="grid grid-cols-1 gap-1">
                    <!-- Reference Entry -->
                    <div class="bg-surface-container-low p-3 rounded-xl flex items-center gap-4 border border-outline-variant/10">
                        <div class="w-16 h-16 rounded-lg overflow-hidden bg-zinc-800 flex-shrink-0">
                            <img src="/api/image?path=${encodeURIComponent(group.ref.path)}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center gap-2">
                                <span class="font-medium text-sm">${group.ref.name}</span>
                                <span class="px-2 py-0.5 bg-primary/20 text-primary text-[10px] font-bold uppercase rounded-full">Reference</span>
                            </div>
                            <span class="text-xs text-zinc-500">${group.ref.folder}</span>
                            <span class="block text-[10px] text-zinc-600 mt-1">${(group.ref.size / 1024 / 1024).toFixed(2)} MB ${group.ref.dimensions ? '| ' + group.ref.dimensions : ''}</span>
                        </div>
                        <div class="px-4">
                            <div class="w-5 h-5 rounded border border-outline-variant/50 flex items-center justify-center opacity-30">
                                <span class="material-symbols-outlined text-sm">lock</span>
                            </div>
                        </div>
                    </div>
                    <!-- Duplicate Rows -->
                    <div class="ml-12 mt-1 space-y-1">
                        ${group.duplicates.map(dupe => `
                            <div class="bg-surface-container p-3 rounded-xl flex items-center gap-4 hover:bg-surface-container-high transition-colors">
                                <div class="w-14 h-14 rounded-lg overflow-hidden bg-zinc-800 flex-shrink-0 opacity-80">
                                    <img src="/api/image?path=${encodeURIComponent(dupe.path)}" class="w-full h-full object-cover">
                                </div>
                                <div class="flex-1">
                                    <span class="font-medium text-sm text-zinc-300">${dupe.name}</span>
                                    <span class="block text-xs text-zinc-500">${dupe.folder}</span>
                                    <div class="flex items-center gap-2 mt-1">
                                        <span class="text-[10px] text-primary-fixed-dim">Match: ${dupe.percentage}%</span>
                                    </div>
                                </div>
                                <div class="px-4">
                                    <input type="checkbox" data-path="${dupe.path}" checked class="w-5 h-5 rounded border-outline-variant bg-surface-container-lowest text-primary focus:ring-0 focus:ring-offset-0">
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </section>
        `).join('');
    }

    elements.addFolderBtn.addEventListener('click', addFolder);
    elements.folderPathInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addFolder(); });
    elements.startScanBtn.addEventListener('click', startScan);
    document.getElementById('deleteSelectedBtn').addEventListener('click', deleteSelected);

    // Initial load
    fetchFolders();
</script>
</body></html>
